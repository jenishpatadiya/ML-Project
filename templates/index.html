<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Exam Performance Indicator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f0f4fd 0%, #e2e8f0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .hero-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            max-width: 580px;
            width: 100%;
            padding: 48px 40px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }

        .icon-badge {
            width: 70px;
            height: 70px;
            background: #eef2ff;
            color: #4f46e5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 32px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 12px;
        }

        p {
            font-size: 15px;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .btn-start {
            display: inline-block;
            background: #4f46e5;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            padding: 14px 36px;
            border-radius: 10px;
            text-decoration: none;
            transition: all 0.25s ease;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
        }

        .btn-start:hover {
            background: #4338ca;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.45);
        }
    </style>
</head>
<body>

    <div class="hero-card">
        <div class="icon-badge">🎓</div>
        <h1>Student Performance Predictor</h1>
        <p>
            Accurately predict expected mathematics exam performance using student demographics, parental education level, lunch type, and preparatory course data.
        </p>
        <!-- Flask URL to your prediction page route -->
        <a href="{{ url_for('predict_datapoint') }}" class="btn-start">
            Get Started &rarr;
        </a>
    </div>

</body>
</html>
